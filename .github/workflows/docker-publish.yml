name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar QEMU (multi-arquitetura)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/celc-api:latest
            ${{ secrets.DOCKER_USERNAME }}/celc-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max